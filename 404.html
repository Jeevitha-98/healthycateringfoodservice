    /* ==========================================================================
   Creative Design Tokens & High-Contrast CSS Variable Matrix

/* Left Content Panel Block styling rules */

/* ==========================================================================
   Right Panel Layer: Vector Animation Mechanics
   ========================================================================== */
.right-animation-panel {
    background: var(--dark-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 3rem;
    overflow: hidden;
}

/* Ambient Glow Layer */
.vector-glow-backdrop {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 260px; height: 260px;
    background-color: var(--primary);
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
}

/* Hero Platter Floating Stage */
.vector-floating-stage {
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1;
    position: relative;
    z-index: 5;
    animation: luxuryFloat 5s ease-in-out infinite;
}

.hero-vector-illustration { width: 100%; height: 100%; }

@keyframes luxuryFloat {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}

/* Background Matrix Elements */
.bg-vector-matrix-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
}

.bg-float-icon { position: absolute; fill: rgba(167, 243, 208, 0.08); }

.icon-speed-1 { animation: matrixFloat1 8s ease-in-out infinite alternate; }
.icon-speed-2 { animation: matrixFloat2 10s ease-in-out infinite alternate; }
.icon-speed-3 { animation: matrixFloat3 12s ease-in-out infinite alternate; }

@keyframes matrixFloat1 {
    0% { transform: translateY(0px) rotate(0deg); }
    100% { transform: translateY(-20px) rotate(10deg); }
}
@keyframes matrixFloat2 {
    0% { transform: translateY(0px) rotate(0deg); }
    100% { transform: translateY(15px) rotate(-15deg); }

@keyframes matrixFloat3 {

    100% { transform: translateY(-15px) translateX(10px) rotate(8deg); }

   <script>
    /**
 * Browser Session History & Dynamic Typing Engine
 * Handles absolute backward steps with tab memory preservation and 2s looping.
 */

document.addEventListener('DOMContentLoaded', () => {
    
    // ==========================================================================
    // 1. Fixed Back Button System (Maintains Tab Memory Context Separations)
    // ==========================================================================
    const goBackTriggerNode = document.getElementById("err-trigger-go-back");

    if (goBackTriggerNode) {
        goBackTriggerNode.addEventListener("click", () => {
            
            // Defensively evaluate previous referrers to keep dashboard view tab memory active
            if (document.referrer && document.referrer !== "") {
                window.location.href = document.referrer;
            } else {
                // Secondary hardware historical fallbacks lookup
                window.history.back();
            }
        });
    }

    // ==========================================================================
    // 2. High-Performance Letter-By-Letter Typing Engine (2-Second Looping)
    // ==========================================================================
    const targetStringPhrase = "Lost In Transit";
    const typingHeadlineTarget = document.getElementById('typingHeadlineTarget');
    
    let stringCharacterIndex = 0;
    const typingSpeedDelayMs = 120;   // Typing speed per character (ms)
    const loopCycleResetDelayMs = 2000; // 2 seconds completion loop wait rule

    function executeLetterPrintPipeline() {
        if (!typingHeadlineTarget) return;

        if (stringCharacterIndex < targetStringPhrase.length) {
            typingHeadlineTarget.textContent += targetStringPhrase.charAt(stringCharacterIndex);
            stringCharacterIndex++;
            setTimeout(executeLetterPrintPipeline, typingSpeedDelayMs);
        } else {
            // Reached string bounds completion: pauses for exactly 2 seconds before recycling variables
            setTimeout(resetAndRebootTypingEngineCycle, loopCycleResetDelayMs);
        }
    }

    function resetAndRebootTypingEngineCycle() {
        if (!typingHeadlineTarget) return;
        
        // Flushes target text nodes cleanly to restart typing loops animations
        typingHeadlineTarget.textContent = "";
        stringCharacterIndex = 0;
        executeLetterPrintPipeline();
    }

    // Fire text typing loop immediately upon thread readiness
    executeLetterPrintPipeline();
});

   </script>
